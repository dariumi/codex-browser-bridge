name: Packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed package artifacts to npm and PyPI
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install build twine
      - run: npm run check
      - run: npm test
      - run: npm run test:python
      - run: npm run package
      - run: npm run lint:firefox
      - run: npm run pack:npm
      - run: python -m build
      - run: npm run test:packages
      - run: python scripts/test-packages.py --install
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/codex-browser-bridge-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
  publish-npm:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-dist
      - run: npm publish npm-dist/*.tgz --access public --provenance
  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: python-dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
